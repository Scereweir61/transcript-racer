<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Transcript Racer</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js"></script>
    </head>
    <body>
        <section id="setup">
            <h2>setup</h2>
            <textarea id="setuptext" name="setuptext" rows="8" cols="80">
                big textarea
            </textarea>
            <button id="startBtn">Start</button>
        </section>
        <section id="play">
            <h2>play</h2>
            <button id="backBtn">Back</button>
        </section>
        <section id="done">
            <h2>done</h2>
        </section>
    </body>
</html>
