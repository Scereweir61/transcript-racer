<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Transcript Racer</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>
    <body>
        <section id="setup">
            <h2>setup</h2>
            <textarea id="source" rows="8" cols="80" placeholder="Paste a transcript here..."></textarea>
            <button id="sampleBtn">Load sample</button>
            <button id="clearBtn">Clear</button>
            <p id="summary"></p>
            <label>
                <input type="checkbox" id="fillers" checked>
                Remove filler words (um, uh, erm)
            </label>
            <label>
                Sentences per section
                <select id="perSection">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="6">6</option>
                </select>
            </label>
            <fieldset id="modePicker">
                <legend>Study mode</legend>
                <label>
                    <input type="radio" name="mode" value="copy" checked>
                    Copy
                    <small>Type the text exactly as you see it.</small>
                </label>
                <label>
                    <input type="radio" name="mode" value="blanks">
                    Fill the blanks
                    <small>Key words are hidden. Type them from memory.</small>
                </label>
                <label>
                    <input type="radio" name="mode" value="recall">
                    Recall
                    <small>Read it, it disappears, then type what you remember.</small>
                </label>
            </fieldset>
            <div id="blanksOptions">
                <label>
                    How many blanks
                    <select id="blankDensity">
                        <option value="0.15">A few</option>
                        <option value="0.3" selected>Some</option>
                        <option value="0.5">Loads</option>
                    </select>
                </label>
            </div>
            <div id="recallOptions">
                <label>
                    Reading time before it hides
                    <select id="readTime">
                        <option value="auto" selected>Auto (based on length)</option>
                        <option value="5">5 seconds</option>
                        <option value="10">10 seconds</option>
                        <option value="20">20 seconds</option>
                        <option value="0">Until I'm ready</option>
                    </select>
                </label>
            </div>
            <h3>First section preview</h3>
            <p id="preview"></p>
            <button id="startBtn">Start</button>
        </section>
        <section id="play">
            <h2>play</h2>
            <button id="backBtn">Back</button>
            <p id="sectionLabel"></p>
            <div id="stats">
                <span>WPM <strong id="wpmStat">0</strong></span>
                <span id="accStatBox">Accuracy <strong id="accStat">100%</strong></span>
                <span>Time <strong id="timeStat">0:00</strong></span>
            </div>
            <div id="typingArea">
                <div id="studyBox">
                    <div id="countdown">
                        <div id="countdownFill"></div>
                    </div>
                    <button id="readyBtn">I'm ready, hide it</button>
                </div>
                <p id="passage"></p>
                <p id="recallMsg"></p>
                <textarea id="typeBox" rows="3" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Start typing..."></textarea>
                <div id="recallButtons">
                    <button id="checkBtn">Check</button>
                    <button id="peekBtn">Peek</button>
                </div>
                <button id="restartBtn">Restart section</button>
                <button id="skipBtn">Skip</button>
                <button id="revealBtn">Reveal word (Tab)</button>
            </div>
            <div id="resultPanel" hidden>
                <h3>Section done!</h3>
                <div id="recallRows">
                    <p>Recalled <strong id="resultRecalled"></strong></p>
                    <p>Words <strong id="resultWords"></strong></p>
                    <p>Peeks <strong id="resultPeeks"></strong></p>
                </div>
                <p>WPM <strong id="resultWpm"></strong></p>
                <p id="accRow">Accuracy <strong id="resultAcc"></strong></p>
                <p id="blanksRow">Blanks recalled <strong id="resultBlanks"></strong></p>
                <p>Time <strong id="resultTime"></strong></p>
                <div id="diffBox">
                    <h4>The original</h4>
                    <p id="diffOriginal"></p>
                    <h4>What you typed</h4>
                    <p id="diffTyped"></p>
                </div>
                <p id="resultNote"></p>
                <button id="nextBtn">Next section</button>
                <button id="retryBtn">Try again</button>
                <button id="endBtn">End session</button>
            </div>
        </section>
        <section id="done">
            <h2>done</h2>
            <p>
                Overall WPM <strong id="totalWpm"></strong>
                Average score <strong id="totalScore"></strong>
                Completed <strong id="totalDone"></strong>
            </p>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th>Section</th>
                        <th class="col-stat">WPM</th>
                        <th class="col-stat">Score</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
            <p id="noResults" hidden>No sections finished this time.</p>
            <button id="weakestBtn">Practise weakest sections</button>
            <button id="againBtn">Do it all again</button>
            <button id="changeBtn">Change transcript or mode</button>
        </section>
    </body>
</html>
